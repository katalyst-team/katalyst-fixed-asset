<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Katalyst Fixed Assets · RFID Control Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
/* ============================================================
   KATALYST FIXED ASSETS · OPERATIONS CONTROL CENTER
   Dark industrial theme · Inter + JetBrains Mono
   Distinct from Katalyst FE (light · Geist · teal)
============================================================ */
:root{
  /* Deep blue base — modern professional */
  --bg: #08101f;
  --surface: #0f1828;
  --surface-2: #16213a;
  --surface-3: #1d2b48;
  --surface-4: #28385c;
  --border: #1d2a45;
  --border-strong: #2a3a5c;
  --border-soft: #15203a;

  /* Text — slightly cool, refined */
  --text: #e8eef9;
  --text-2: #8da0c4;
  --text-3: #5e7298;
  --text-4: #3e5174;

  /* Accents — vivid blue / electric cyan */
  --brand: #3b82f6;
  --brand-2: #2563eb;
  --brand-soft: rgba(59, 130, 246, 0.14);
  --brand-strong: #60a5fa;
  --cyan: #06b6d4;
  --cyan-soft: rgba(6, 182, 212, 0.12);

  /* Status */
  --success: #10b981;
  --success-soft: rgba(16, 185, 129, 0.14);
  --warn: #f59e0b;
  --warn-soft: rgba(245, 158, 11, 0.14);
  --danger: #ef4444;
  --danger-soft: rgba(239, 68, 68, 0.14);
  --purple: #8b5cf6;
  --purple-soft: rgba(139, 92, 246, 0.14);
  --pink: #ec4899;
  --pink-soft: rgba(236, 72, 153, 0.14);

  /* Geometry */
  --r-xs: 4px;
  --r-sm: 6px;
  --r-md: 8px;
  --r-lg: 12px;

  /* Shadows */
  --shadow-1: 0 1px 0 rgba(255,255,255,.03) inset, 0 1px 2px rgba(0,0,0,.4);
  --shadow-2: 0 4px 12px rgba(0,0,0,.4), 0 1px 0 rgba(255,255,255,.03) inset;
  --shadow-3: 0 16px 40px rgba(0,0,0,.55);
  --glow-brand: 0 0 0 1px rgba(59,130,246,.4), 0 0 24px rgba(59,130,246,.18);

  /* Layout */
  --sidebar-w: 232px;
  --topbar-h: 52px;
}

/* === LIGHT MODE === */
html[data-theme="light"]{
  --bg: #f1f5fb;
  --surface: #ffffff;
  --surface-2: #eff4fc;
  --surface-3: #e1ebf8;
  --surface-4: #cfdcf0;
  --border: #dde7f3;
  --border-strong: #b9cae0;
  --border-soft: #e8eff8;

  --text: #0f1828;
  --text-2: #41506b;
  --text-3: #6b7d99;
  --text-4: #94a5c0;

  --brand: #2563eb;
  --brand-2: #1d4ed8;
  --brand-soft: rgba(37, 99, 235, 0.10);
  --brand-strong: #1e40af;
  --cyan: #0891b2;
  --cyan-soft: rgba(8, 145, 178, 0.10);

  --success: #059669;
  --success-soft: rgba(5, 150, 105, 0.10);
  --warn: #d97706;
  --warn-soft: rgba(217, 119, 6, 0.10);
  --danger: #dc2626;
  --danger-soft: rgba(220, 38, 38, 0.10);
  --purple: #7c3aed;
  --purple-soft: rgba(124, 58, 237, 0.10);
  --pink: #db2777;
  --pink-soft: rgba(219, 39, 119, 0.10);

  --shadow-1: 0 1px 2px rgba(15,30,60,.06);
  --shadow-2: 0 4px 14px rgba(15,30,60,.08);
  --shadow-3: 0 18px 44px rgba(15,30,60,.14);

  color-scheme: light;
}
html[data-theme="light"] .sb{ background: linear-gradient(180deg, #ffffff 0%, #eff4fc 100%); }
html[data-theme="light"] body{ color-scheme: light; }

*{box-sizing:border-box}
html,body{margin:0;padding:0; color-scheme:dark}
body{
  font-family: "Inter", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  font-size:13px; line-height:1.55;
  background:var(--bg); color:var(--text);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "cv01","cv02","cv03","cv04","cv11","ss01","ss03";
  letter-spacing:-0.005em;
  background-image:
    radial-gradient(900px 400px at 80% -10%, rgba(59,130,246,.06), transparent 60%),
    radial-gradient(700px 400px at 10% 100%, rgba(6,182,212,.04), transparent 60%);
  background-attachment: fixed;
}
html[data-theme="light"] body{
  background-image:
    radial-gradient(900px 400px at 80% -10%, rgba(37,99,235,.05), transparent 60%),
    radial-gradient(700px 400px at 10% 100%, rgba(8,145,178,.04), transparent 60%);
}
button{font-family:inherit; cursor:pointer; border:0; background:none; color:inherit; padding:0}
a{color:inherit; text-decoration:none}
input, select, textarea{font-family:inherit; color:inherit}
.mono{font-family:"JetBrains Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums; letter-spacing:0}
.display{font-family:"Space Grotesk", "Inter", system-ui, sans-serif; letter-spacing:-0.02em}

/* scrollbars */
*::-webkit-scrollbar{width:10px; height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:rgba(255,255,255,.06); border-radius:99px; border:2px solid transparent; background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.14); background-clip:padding-box; border:2px solid transparent}

/* selection */
::selection{background:var(--brand); color:white}

/* focus */
*:focus-visible{outline:2px solid var(--brand); outline-offset:2px; border-radius:6px}

/* ============================================================
   LAYOUT SHELL
============================================================ */
.app{
  display:grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  min-height:100vh;
}

/* === SIDEBAR === */
.sb{
  background:linear-gradient(180deg, #0d1219 0%, #0a0e14 100%);
  border-right:1px solid var(--border);
  position:sticky; top:0; height:100vh;
  display:flex; flex-direction:column;
  overflow:hidden;
}
.sb-head{
  padding:16px 18px 14px;
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:10px;
}
.sb-logo{
  width:30px; height:30px; border-radius:8px;
  background: linear-gradient(135deg, var(--brand), var(--cyan));
  display:grid; place-items:center;
  font-family:"Space Grotesk", sans-serif; font-weight:700; font-size:14px;
  color:white;
  box-shadow: 0 0 0 1px rgba(255,255,255,.1) inset, 0 4px 12px rgba(59,130,246,.3);
}
.sb-brand{font-family:"Space Grotesk", sans-serif; font-weight:600; font-size:14px; letter-spacing:-0.01em; line-height:1.15}
.sb-brand small{display:block; font-size:9.5px; color:var(--text-3); font-weight:500; letter-spacing:0.04em; text-transform:uppercase; margin-top:2px}

.sb-nav{flex:1; overflow-y:auto; padding:8px 8px 16px}
.sb-group-label{
  font-size:9.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.1em;
  color:var(--text-3); padding:14px 10px 6px; display:flex; align-items:center; gap:8px;
}
.sb-group-label::after{content:''; flex:1; height:1px; background:var(--border-soft)}
.sb-item{
  display:flex; align-items:center; gap:9px;
  padding:7px 10px; border-radius:6px;
  font-size:12.5px; font-weight:500;
  color:var(--text-2); cursor:pointer; user-select:none;
  margin:1px 0;
  transition: background .14s, color .14s;
}
.sb-item:hover{background:var(--surface-2); color:var(--text)}
.sb-item.active{
  background: linear-gradient(180deg, var(--brand-soft), rgba(59,130,246,0.04));
  color:var(--brand-strong);
  font-weight:600;
  box-shadow: inset 0 0 0 1px rgba(59,130,246,.28), inset 2px 0 0 var(--brand), 0 0 14px -4px rgba(59,130,246,.4);
}
.sb-item .sb-badge{
  margin-left:auto; font-size:9.5px; padding:1.5px 6px; border-radius:99px;
  background:var(--surface-3); color:var(--text-3); font-weight:600;
}
.sb-item.active .sb-badge{background:var(--brand-soft); color:var(--brand-strong)}

.sb-foot{
  padding:12px; border-top:1px solid var(--border);
  display:flex; align-items:center; gap:10px;
}
.sb-foot-info{flex:1; min-width:0}
.sb-foot-name{font-size:12px; font-weight:600}
.sb-foot-org{font-size:10px; color:var(--text-3)}
.sb-status{
  display:inline-flex; align-items:center; gap:5px;
  font-size:10px; color:var(--success); font-weight:600;
}
.sb-status::before{
  content:''; width:6px; height:6px; border-radius:50%;
  background:var(--success); box-shadow:0 0 8px var(--success);
  animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse{ 50%{opacity:.4} }

/* === TOPBAR === */
.tb{
  height:var(--topbar-h);
  border-bottom:1px solid var(--border);
  background:rgba(15,24,40,.65);
  backdrop-filter:saturate(160%) blur(14px);
  -webkit-backdrop-filter:saturate(160%) blur(14px);
  padding:0 20px; display:flex; align-items:center; gap:14px;
  position:sticky; top:0; z-index:10;
  box-shadow: 0 1px 0 color-mix(in oklab, var(--brand) 14%, transparent);
}
html[data-theme="light"] .tb{
  background:rgba(255,255,255,.75);
  box-shadow: 0 1px 0 color-mix(in oklab, var(--brand) 12%, transparent);
}
.tb-end{
  margin-left:auto; display:flex; align-items:center; gap:4px;
  height:100%; padding-left:14px;
  border-left:1px solid var(--border);
}
.tb-crumbs{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-2); min-width:0}
.tb-crumbs b{color:var(--text); font-weight:600}
.tb-crumbs .sep{color:var(--text-4)}
.tb-search{
  flex:1; max-width:480px;
  display:flex; align-items:center; gap:8px;
  background:var(--surface); border:1px solid var(--border);
  border-radius:7px; padding:6px 11px;
  color:var(--text-3); font-size:12.5px;
  transition: border-color .14s, background .14s;
}
.tb-search:focus-within{ border-color:var(--brand); background:var(--surface-2); box-shadow: 0 0 0 3px rgba(59,130,246,.12) }
.tb-search input{
  flex:1; background:transparent; border:0; outline:0; color:var(--text);
  font-size:12.5px; min-width:0;
}
.tb-search input::placeholder{color:var(--text-3)}
.kbd{
  font-family:"JetBrains Mono",monospace; font-size:10px; font-weight:500;
  padding:2px 5px; border-radius:4px; background:var(--surface-3); color:var(--text-3);
  border:1px solid var(--border);
}
.tb-action{
  width:32px; height:32px; border-radius:7px;
  display:grid; place-items:center;
  color:var(--text-2); transition: all .14s;
  position:relative;
}
.tb-action:hover{background:var(--surface-2); color:var(--text)}
.tb-action .dot{position:absolute; top:6px; right:7px; width:6px; height:6px; border-radius:50%; background:var(--danger); border:1px solid var(--surface)}

/* === MAIN / PAGE === */
.main{display:flex; flex-direction:column; min-width:0; min-height:100vh}
.page{padding:24px 28px 56px; max-width:100%}
.page-head{
  display:flex; align-items:flex-start; justify-content:space-between;
  gap:20px; margin-bottom:22px;
}
.page-title{
  font-family:"Space Grotesk", sans-serif;
  font-size:22px; font-weight:600; letter-spacing:-0.025em;
  margin:0;
  background: linear-gradient(180deg, var(--text) 0%, color-mix(in oklab, var(--text) 85%, var(--brand)) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.page-desc{font-size:12.5px; color:var(--text-2); margin-top:4px; max-width:640px}
.page-actions{display:flex; gap:8px}

/* === ATOMS === */
.card{
  background: linear-gradient(180deg, var(--surface) 0%, color-mix(in oklab, var(--surface) 92%, var(--surface-2)) 100%);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-1), inset 0 1px 0 rgba(255,255,255,.025);
  overflow:hidden;
  transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
}
.card:hover{
  border-color: color-mix(in oklab, var(--brand) 28%, var(--border));
  box-shadow: var(--shadow-2), 0 0 0 1px color-mix(in oklab, var(--brand) 12%, transparent), inset 0 1px 0 rgba(255,255,255,.03);
}
html[data-theme="light"] .card{
  background: linear-gradient(180deg, var(--surface) 0%, color-mix(in oklab, var(--surface) 96%, var(--surface-2)) 100%);
  box-shadow: var(--shadow-1);
}
html[data-theme="light"] .card:hover{
  box-shadow: var(--shadow-2), 0 0 0 1px color-mix(in oklab, var(--brand) 20%, transparent);
}
.card-h{
  padding:13px 16px;
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
  gap:10px;
}
.card-t{font-size:13px; font-weight:600; letter-spacing:-0.01em}
.card-sub{font-size:11px; color:var(--text-3); margin-top:1px}
.card-b{padding:16px}

.btn{
  display:inline-flex; align-items:center; gap:6px;
  height:32px; padding:0 12px;
  font-size:12.5px; font-weight:550;
  border-radius:7px;
  background:var(--surface-2); color:var(--text);
  border:1px solid var(--border);
  transition: background .14s, border-color .14s, color .14s;
}
.btn:hover{background:var(--surface-3); border-color:var(--border-strong)}
.btn-primary{
  background: linear-gradient(180deg, var(--brand) 0%, var(--brand-2) 100%);
  color:white; border-color: var(--brand-2);
  box-shadow: 0 0 0 1px rgba(255,255,255,.12) inset, 0 2px 8px -1px rgba(59,130,246,.45), 0 0 18px -4px rgba(59,130,246,.5);
}
.btn-primary:hover{
  background: linear-gradient(180deg, var(--brand-strong) 0%, var(--brand) 100%);
  border-color: var(--brand-strong);
  box-shadow: 0 0 0 1px rgba(255,255,255,.14) inset, 0 4px 16px -2px rgba(59,130,246,.6), 0 0 28px -6px rgba(59,130,246,.7);
  transform: translateY(-0.5px);
}
.btn-ghost{background:transparent; border-color:transparent; color:var(--text-2)}
.btn-ghost:hover{background:var(--surface-2); color:var(--text); border-color:var(--border)}
.btn-danger{background:var(--danger-soft); color:var(--danger); border-color:rgba(248,113,113,.25)}
.btn-danger:hover{background:rgba(248,113,113,.18)}
.btn-sm{height:26px; padding:0 9px; font-size:11.5px; border-radius:6px}
.btn-i{width:32px; padding:0; justify-content:center}
.btn-i.btn-sm{width:26px}

/* Badge */
.b{
  display:inline-flex; align-items:center; gap:4px;
  font-size:10.5px; font-weight:600;
  padding:2px 7px; border-radius:99px;
  background:var(--surface-3); color:var(--text-2);
  letter-spacing:0.01em; white-space:nowrap;
}
.b.s{background:var(--success-soft); color:var(--success)}
.b.w{background:var(--warn-soft); color:var(--warn)}
.b.d{background:var(--danger-soft); color:var(--danger)}
.b.i{background:var(--brand-soft); color:var(--brand-strong)}
.b.p{background:var(--purple-soft); color:var(--purple)}
.b.c{background:var(--cyan-soft); color:var(--cyan)}
.b.pk{background:var(--pink-soft); color:var(--pink)}
.b.dot::before{
  content:''; width:5px; height:5px; border-radius:50%;
  background:currentColor; box-shadow:0 0 6px currentColor;
}

/* Stat tile */
.stat{
  background: linear-gradient(180deg, var(--surface) 0%, color-mix(in oklab, var(--surface) 90%, var(--surface-2)) 100%);
  border:1px solid var(--border);
  border-radius:var(--r-md);
  padding:14px 16px;
  display:flex; flex-direction:column; gap:6px;
  box-shadow: var(--shadow-1), inset 0 1px 0 rgba(255,255,255,.03);
  position:relative; overflow:hidden;
  transition: border-color .18s ease, transform .18s ease, box-shadow .18s ease;
}
.stat:hover{
  border-color: color-mix(in oklab, var(--brand) 32%, var(--border));
  transform: translateY(-1px);
  box-shadow: var(--shadow-2);
}
.stat::after{
  content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
  background:var(--brand); opacity:0;
  transition: opacity .18s ease;
  box-shadow: 0 0 12px var(--brand);
}
.stat:hover::after{ opacity: .4 }
.stat.brand::after{background:var(--brand); opacity:1; box-shadow: 0 0 12px var(--brand)}
.stat.success::after{background:var(--success); opacity:1; box-shadow: 0 0 12px var(--success)}
.stat.warn::after{background:var(--warn); opacity:1; box-shadow: 0 0 10px var(--warn)}
.stat.danger::after{background:var(--danger); opacity:1; box-shadow: 0 0 10px var(--danger)}
.stat.cyan::after{background:var(--cyan); opacity:1; box-shadow: 0 0 12px var(--cyan)}
.stat-l{
  font-size:10px; font-weight:600; letter-spacing:0.08em;
  text-transform:uppercase; color:var(--text-3);
}
.stat-v{
  font-family:"Space Grotesk", sans-serif;
  font-size:22px; font-weight:600; letter-spacing:-0.02em; line-height:1;
  font-variant-numeric:tabular-nums;
}
.stat-v small{font-size:13px; color:var(--text-3); font-weight:500; margin-left:4px}
.stat-d{font-size:10.5px; color:var(--text-3); display:flex; align-items:center; gap:5px}

/* Inputs */
.input, .select{
  background:var(--surface); color:var(--text);
  border:1px solid var(--border); border-radius:7px;
  padding:6px 10px; font-size:12.5px;
  outline:none; transition: border-color .14s, box-shadow .14s, background .14s;
  height:32px;
}
.input:hover, .select:hover{border-color:var(--border-strong)}
.input:focus, .select:focus{
  border-color: var(--brand); background:var(--surface-2);
  box-shadow: 0 0 0 3px rgba(59,130,246,.12);
}
.input::placeholder{color:var(--text-3)}
.select{appearance:none; padding-right:28px; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238b94a6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>"); background-repeat:no-repeat; background-position:right 8px center; background-size:14px}

/* Table */
.tbl{width:100%; border-collapse:collapse; font-size:12.5px}
.tbl thead th{
  text-align:left; font-weight:600; font-size:10px;
  text-transform:uppercase; letter-spacing:0.08em;
  color:var(--text-3);
  padding:10px 14px; background:var(--surface-2);
  border-bottom:1px solid var(--border);
  white-space:nowrap;
}
.tbl tbody td{
  padding:11px 14px;
  border-bottom:1px solid var(--border-soft);
  vertical-align:middle;
}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr:hover{background:rgba(59,130,246,.04)}
.tbl tbody tr.sel{background:var(--brand-soft)}
.tbl tbody tr.sel:hover{background:rgba(59,130,246,.18)}
.tbl tbody tr.row-link{cursor:pointer}
.tbl-foot{
  padding:11px 16px; display:flex; align-items:center; justify-content:space-between;
  font-size:11.5px; color:var(--text-3);
}

/* Avatar */
.av{
  width:26px; height:26px; border-radius:50%;
  display:grid; place-items:center;
  font-size:10.5px; font-weight:600; color:#fff;
  flex-shrink:0;
}

/* Icon container */
.ico{
  width:32px; height:32px; border-radius:7px;
  display:grid; place-items:center;
  background:var(--surface-3); color:var(--text-2);
  flex-shrink:0;
}
.ico.i{background:var(--brand-soft); color:var(--brand-strong)}
.ico.s{background:var(--success-soft); color:var(--success)}
.ico.w{background:var(--warn-soft); color:var(--warn)}
.ico.d{background:var(--danger-soft); color:var(--danger)}
.ico.c{background:var(--cyan-soft); color:var(--cyan)}
.ico.p{background:var(--purple-soft); color:var(--purple)}
.ico.pk{background:var(--pink-soft); color:var(--pink)}

/* Meter */
.meter{height:5px; background:var(--surface-3); border-radius:99px; overflow:hidden; position:relative}
.meter-f{height:100%; border-radius:99px; transition:width .4s ease}
.meter-f.brand{background:linear-gradient(90deg, var(--brand), var(--cyan))}
.meter-f.success{background:linear-gradient(90deg, var(--success), #5eead4)}
.meter-f.warn{background:linear-gradient(90deg, var(--warn), #fcd34d)}
.meter-f.danger{background:linear-gradient(90deg, var(--danger), #fda4af)}

/* Tabs (within page) */
.tabs{display:flex; gap:0; border-bottom:1px solid var(--border); margin-bottom:18px}
.tab{
  padding:9px 14px;
  font-size:12.5px; font-weight:550;
  color:var(--text-2);
  border-bottom:2px solid transparent;
  margin-bottom:-1px;
  transition: color .14s, border-color .14s;
}
.tab:hover{color:var(--text)}
.tab.on{color:var(--brand-strong); border-color:var(--brand); font-weight:600}

/* Filter chips */
.chip{
  display:inline-flex; align-items:center; gap:5px;
  padding:5px 11px; border-radius:99px;
  font-size:11.5px; font-weight:550;
  background:var(--surface-2); border:1px solid var(--border);
  color:var(--text-2); transition: all .14s;
}
.chip:hover{background:var(--surface-3); color:var(--text)}
.chip.on{background:var(--brand-soft); border-color:rgba(59,130,246,.4); color:var(--brand-strong)}

/* Toast */
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background:var(--surface-3); border:1px solid var(--border-strong);
  border-radius:10px; padding:11px 16px;
  display:flex; align-items:center; gap:10px;
  box-shadow: var(--shadow-3);
  z-index:100;
  animation: toastIn .26s cubic-bezier(.22,.94,.36,1.01) both;
  font-size:12.5px;
}
@keyframes toastIn{ from{opacity:0; transform: translate(-50%, 12px)} to{opacity:1; transform:translate(-50%, 0)} }

/* Status dot (general) */
.sd{
  width:8px; height:8px; border-radius:50%;
  display:inline-block; flex-shrink:0;
  box-shadow:0 0 0 2px color-mix(in oklab, currentColor 18%, transparent);
}

/* SVG canvases */
.svg-bg{background:var(--surface-2); border-radius:8px}

/* Live ping */
.ping{
  width:7px; height:7px; border-radius:50%;
  background:var(--success);
  box-shadow: 0 0 8px var(--success);
  animation: pulse 1.4s ease-in-out infinite;
  display:inline-block;
}

/* Cell helpers */
.cell-asset{display:flex; align-items:center; gap:10px; min-width:0}
.asset-name{font-weight:600; font-size:12.5px}
.asset-id{font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--text-3); margin-top:1px}

/* Page-level entrance */
.page-in{ animation: pageIn .25s ease-out both }
@keyframes pageIn{ from{opacity:0; transform: translateY(4px)} to{opacity:1; transform:translateY(0)} }

/* Toggle pill */
.pill-group{
  display:inline-flex; padding:3px;
  background:var(--surface-2); border:1px solid var(--border);
  border-radius:8px; gap:0;
}
.pill-group button{
  padding:5px 11px; font-size:11.5px; font-weight:550;
  color:var(--text-2); border-radius:5px;
}
.pill-group button.on{
  background:var(--surface-3); color:var(--text);
  box-shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 1px 2px rgba(0,0,0,.4);
}

/* Mini bar chart cell */
.spark{display:flex; align-items:flex-end; gap:2px; height:24px}
.spark i{display:block; width:3px; background:var(--brand); border-radius:1px; opacity:.7}

/* Drawer / sheet */
.sheet-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:50;
  backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
  animation: fadeIn .2s both;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{
  position:fixed; right:0; top:0; bottom:0; width:480px;
  background:var(--surface); border-left:1px solid var(--border);
  z-index:51;
  display:flex; flex-direction:column;
  box-shadow: -16px 0 40px rgba(0,0,0,.4);
  animation: slideIn .22s cubic-bezier(.22,.94,.36,1.01) both;
}
@keyframes slideIn{from{transform:translateX(100%)} to{transform:translateX(0)}}

/* === MODAL (centered dialog form) === */
.modal-overlay{
  position:fixed; inset:0; z-index:120;
  background:rgba(2,8,20,.55);
  backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
  display:flex; align-items:center; justify-content:center; padding:24px;
  animation: fadeIn .16s ease both;
}
html[data-theme="light"] .modal-overlay{ background:rgba(15,30,60,.38) }
.modal{
  width:min(520px, 96vw); max-height:88vh;
  display:flex; flex-direction:column;
  background: linear-gradient(180deg, var(--surface) 0%, color-mix(in oklab, var(--surface) 92%, var(--surface-2)) 100%);
  border:1px solid color-mix(in oklab, var(--brand) 22%, var(--border));
  border-radius:14px;
  box-shadow: 0 32px 80px -16px rgba(0,0,0,.55), 0 0 0 1px color-mix(in oklab, var(--brand) 12%, transparent);
  animation: cmdIn .2s cubic-bezier(.22,.94,.36,1.01) both;
  overflow:hidden;
}
.modal.wide{ width:min(680px, 96vw) }
.modal-h{ padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:flex-start; justify-content:space-between; gap:12px }
.modal-h-t{ font-size:15.5px; font-weight:650; letter-spacing:-0.01em }
.modal-h-s{ font-size:11px; color:var(--text-3); margin-top:2px }
.modal-b{ padding:18px 20px; overflow-y:auto; display:flex; flex-direction:column; gap:13px }
.modal-f{ padding:14px 20px; border-top:1px solid var(--border); display:flex; gap:8px; justify-content:flex-end; background: color-mix(in oklab, var(--surface-2) 50%, var(--surface)) }

.field{ display:flex; flex-direction:column; gap:6px }
.field-row{ display:grid; gap:12px }
.field-l{ font-size:11.5px; font-weight:600; color:var(--text-2) }
.field-l .req{ color:var(--danger); margin-left:2px }
.field-hint{ font-size:10.5px; color:var(--text-3) }
.field .input, .field .select, .field textarea.input{ width:100%; height:auto }
.field .input, .field .select{ height:38px }
textarea.input{ min-height:72px; padding:9px 11px; resize:vertical; line-height:1.5 }

/* Empty state */
.empty{
  padding:48px 20px; text-align:center; color:var(--text-3);
  display:flex; flex-direction:column; align-items:center; gap:10px;
}

/* === ROUTE LOADER (top progress bar) === */
.route-loader{
  position:fixed; top:0; left:0; right:0; height:2px;
  background: linear-gradient(90deg, transparent 0%, var(--brand) 40%, var(--cyan) 60%, transparent 100%);
  z-index:1000;
  transform-origin: left;
  animation: routeLoad 900ms cubic-bezier(.2,.7,.3,1) forwards;
  pointer-events:none;
}
@keyframes routeLoad{
  0%   { transform: scaleX(0);   opacity: 1 }
  60%  { transform: scaleX(.7);  opacity: 1 }
  85%  { transform: scaleX(.92); opacity: 1 }
  100% { transform: scaleX(1);   opacity: 0 }
}

/* === COMMAND PALETTE (⌘K) === */
.cmd-overlay{
  position:fixed; inset:0;
  background:rgba(2,8,20,.6);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index:200;
  display:flex; justify-content:center; padding-top:14vh;
  animation: fadeIn .15s ease both;
}
html[data-theme="light"] .cmd-overlay{ background: rgba(15,30,60,.4) }
.cmd{
  width:min(640px, 92vw);
  background: linear-gradient(180deg, var(--surface) 0%, color-mix(in oklab, var(--surface) 90%, var(--surface-2)) 100%);
  border:1px solid color-mix(in oklab, var(--brand) 26%, var(--border));
  border-radius:14px;
  box-shadow: 0 32px 80px -16px rgba(0,0,0,.55),
              0 0 0 1px color-mix(in oklab, var(--brand) 14%, transparent),
              0 0 60px -10px color-mix(in oklab, var(--brand) 30%, transparent);
  overflow:hidden;
  animation: cmdIn .2s cubic-bezier(.22,.94,.36,1.01) both;
  max-height:70vh; display:flex; flex-direction:column;
}
@keyframes cmdIn{ from{opacity:0; transform: translateY(-12px) scale(.985)} to{opacity:1; transform:none} }
.cmd-search{
  display:flex; align-items:center; gap:11px;
  padding:14px 18px;
  border-bottom: 1px solid var(--border);
  color: var(--text-2);
}
.cmd-search input{
  flex:1; background:transparent; border:0; outline:0;
  color: var(--text); font-family:inherit; font-size:14px;
  padding:2px 0;
}
.cmd-search input::placeholder{ color:var(--text-3) }
.cmd-list{ flex:1; overflow:auto; padding:6px }
.cmd-section{
  font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  color:var(--text-3); padding: 10px 12px 5px;
}
.cmd-item{
  display:flex; align-items:center; gap:11px;
  padding:9px 12px; border-radius:8px;
  cursor:pointer; transition:background .12s;
  margin: 1px 0;
}
.cmd-item.on{
  background: linear-gradient(90deg, var(--brand-soft), color-mix(in oklab, var(--brand-soft) 60%, transparent));
  box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--brand) 24%, transparent);
}
.cmd-empty{
  padding:32px 20px; text-align:center; color:var(--text-3); font-size:12.5px;
}
.cmd-foot{
  padding: 9px 16px; border-top:1px solid var(--border);
  display:flex; justify-content:space-between; align-items:center;
  font-size:10.5px; color:var(--text-3);
  background: color-mix(in oklab, var(--surface-2) 60%, var(--surface));
}
.cmd-foot .kbd{
  display:inline-block; padding:1px 5px;
  background: var(--surface-3); border:1px solid var(--border);
  border-radius:4px; font-size:9.5px; font-family:"JetBrains Mono", monospace;
  color: var(--text-2); margin: 0 2px;
}

/* Splash screen */
#splash{
  position:fixed; inset:0; z-index:9999;
  background: radial-gradient(circle at 50% 40%, #12203a 0%, #08101f 70%);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:18px; color:#fff;
  transition: opacity .45s ease;
}
html[data-theme="light"] #splash{
  background: radial-gradient(circle at 50% 40%, #ffffff 0%, #eef2f8 70%);
  color: #1a2030;
}
#splash.gone{ opacity:0; pointer-events:none }
.splash-logo{
  width:64px; height:64px; border-radius:16px;
  background: linear-gradient(135deg, #3b82f6, #06b6d4);
  display:grid; place-items:center;
  font-family:"Space Grotesk", sans-serif; font-weight:700; font-size:30px;
  color:#fff;
  box-shadow: 0 0 0 1px rgba(255,255,255,.12) inset,
              0 12px 32px -8px rgba(59,130,246,.55),
              0 0 80px -10px rgba(59,130,246,.4);
  animation: splashPop .6s cubic-bezier(.2,.9,.3,1.1) both;
}
@keyframes splashPop{ from{transform:scale(.6); opacity:0} to{transform:scale(1); opacity:1} }
.splash-name{ font-family:"Space Grotesk", sans-serif; font-weight:600; font-size:22px; letter-spacing:.18em }
.splash-sub{ font-size:11px; color:rgba(255,255,255,.5); letter-spacing:.16em; text-transform:uppercase }
html[data-theme="light"] .splash-sub{ color: rgba(26,32,48,.5) }
.splash-bar{
  width:160px; height:3px; border-radius:99px;
  background: rgba(255,255,255,.08); margin-top:14px; overflow:hidden; position:relative;
}
html[data-theme="light"] .splash-bar{ background: rgba(26,32,48,.08) }
.splash-bar::after{
  content:''; position:absolute; inset:0;
  background: linear-gradient(90deg, transparent, #3b82f6, #06b6d4, transparent);
  animation: splashSlide 1.2s ease-in-out infinite;
}
@keyframes splashSlide{ 0%{transform:translateX(-100%)} 100%{transform:translateX(100%)} }

/* ============================================================
   LOGIN SCREEN
============================================================ */
.login{
  position:fixed; inset:0; z-index:40;
  display:grid; grid-template-columns: 1fr 1fr;
  background:var(--bg);
  animation: fadeIn .35s ease both;
}
@media (max-width: 920px){ .login{ grid-template-columns: 1fr } .login-aside{ display:none !important } }

/* Left — form */
.login-main{
  display:flex; flex-direction:column;
  padding:36px 48px;
  position:relative; overflow-y:auto;
}
.login-topbar{ display:flex; align-items:center; justify-content:space-between; gap:12px }
.login-wordmark{ display:flex; align-items:center; gap:11px }
.login-logo{
  width:36px; height:36px; border-radius:9px;
  background: linear-gradient(135deg, var(--brand), var(--cyan));
  display:grid; place-items:center;
  font-family:"Space Grotesk", sans-serif; font-weight:700; font-size:17px; color:#fff;
  box-shadow: 0 0 0 1px rgba(255,255,255,.12) inset, 0 6px 18px -4px rgba(59,130,246,.5);
}
.login-wordmark-t{ font-family:"Space Grotesk", sans-serif; font-weight:600; font-size:15px; letter-spacing:-0.01em; line-height:1.1 }
.login-wordmark-t small{ display:block; font-size:9px; color:var(--text-3); font-weight:500; letter-spacing:.12em; text-transform:uppercase; margin-top:2px }

.login-body{ flex:1; display:flex; flex-direction:column; justify-content:center; max-width:380px; margin:0 auto; width:100%; padding:32px 0 }
.login-h1{ font-family:"Space Grotesk", sans-serif; font-size:27px; font-weight:600; letter-spacing:-0.03em; margin:0 0 6px }
.login-sub{ font-size:13px; color:var(--text-2); margin:0 0 26px }

.login-field{ margin-bottom:14px }
.login-label{ display:block; font-size:11.5px; font-weight:600; color:var(--text-2); margin-bottom:6px }
.login-input{
  width:100%; height:42px;
  background:var(--surface); color:var(--text);
  border:1px solid var(--border); border-radius:9px;
  padding:0 14px 0 40px; font-size:13.5px;
  outline:none; transition: border-color .14s, box-shadow .14s, background .14s;
}
.login-input:focus{ border-color:var(--brand); background:var(--surface-2); box-shadow: 0 0 0 3px rgba(59,130,246,.14) }
.login-input::placeholder{ color:var(--text-3) }
.login-input-wrap{ position:relative; display:flex; align-items:center }
.login-input-wrap > .login-ico{ position:absolute; left:13px; color:var(--text-3); pointer-events:none; display:grid; place-items:center }
.login-input-wrap > .login-eye{ position:absolute; right:11px; color:var(--text-3); width:26px; height:26px; border-radius:6px; display:grid; place-items:center }
.login-input-wrap > .login-eye:hover{ color:var(--text); background:var(--surface-3) }

.login-row{ display:flex; align-items:center; justify-content:space-between; margin:4px 0 20px; font-size:12px }
.login-check{ display:flex; align-items:center; gap:7px; color:var(--text-2); cursor:pointer; user-select:none }
.login-check input{ width:15px; height:15px; accent-color:var(--brand) }
.login-link{ color:var(--brand-strong); font-weight:550 }
.login-link:hover{ text-decoration:underline }

.login-btn{
  width:100%; height:44px; border-radius:10px;
  display:flex; align-items:center; justify-content:center; gap:8px;
  font-size:13.5px; font-weight:600;
  background: linear-gradient(180deg, var(--brand) 0%, var(--brand-2) 100%);
  color:#fff; border:1px solid var(--brand-2);
  box-shadow: 0 0 0 1px rgba(255,255,255,.12) inset, 0 4px 14px -2px rgba(59,130,246,.5);
  transition: transform .14s, box-shadow .14s;
}
.login-btn:hover{ transform: translateY(-1px); box-shadow: 0 0 0 1px rgba(255,255,255,.14) inset, 0 8px 22px -3px rgba(59,130,246,.65) }
.login-btn:disabled{ opacity:.6; cursor:not-allowed; transform:none }

.login-divider{ display:flex; align-items:center; gap:12px; margin:20px 0; color:var(--text-3); font-size:11px; text-transform:uppercase; letter-spacing:.08em }
.login-divider::before, .login-divider::after{ content:''; flex:1; height:1px; background:var(--border) }

.login-sso{ display:flex; flex-direction:column; gap:9px }
.login-sso-btn{
  width:100%; height:42px; border-radius:9px;
  display:flex; align-items:center; justify-content:center; gap:10px;
  font-size:12.5px; font-weight:550;
  background:var(--surface); color:var(--text);
  border:1px solid var(--border); transition: background .14s, border-color .14s;
}
.login-sso-btn:hover{ background:var(--surface-2); border-color:var(--border-strong) }

.login-foot{ display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:11px; color:var(--text-3); padding-top:8px }
.login-mfa{
  display:flex; align-items:center; gap:8px;
  padding:10px 12px; border-radius:9px; margin-bottom:18px;
  background:var(--success-soft); border:1px solid color-mix(in oklab, var(--success) 22%, var(--border));
  font-size:11.5px; color:var(--text-2);
}

/* Right — control-center visual */
.login-aside{
  position:relative; overflow:hidden;
  background:
    radial-gradient(700px 500px at 70% 20%, rgba(59,130,246,.16), transparent 60%),
    radial-gradient(600px 500px at 20% 90%, rgba(6,182,212,.12), transparent 55%),
    linear-gradient(160deg, #0b1426 0%, #0a1120 60%, #0c1830 100%);
  border-left:1px solid var(--border);
  display:flex; flex-direction:column; justify-content:space-between;
  padding:44px;
}
html[data-theme="light"] .login-aside{
  background:
    radial-gradient(700px 500px at 70% 20%, rgba(37,99,235,.14), transparent 60%),
    radial-gradient(600px 500px at 20% 90%, rgba(8,145,178,.10), transparent 55%),
    linear-gradient(160deg, #1a2742 0%, #16213a 60%, #1d2b48 100%);
}
.login-aside-grid{
  position:absolute; inset:0; opacity:.5;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: radial-gradient(circle at 60% 40%, #000 30%, transparent 75%);
  -webkit-mask-image: radial-gradient(circle at 60% 40%, #000 30%, transparent 75%);
}
.login-aside-eyebrow{ position:relative; font-size:11px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:#7da6e8 }
.login-aside-h{ position:relative; font-family:"Space Grotesk", sans-serif; font-size:30px; font-weight:600; letter-spacing:-0.025em; color:#eaf1fc; margin:14px 0 0; max-width:420px; line-height:1.2 }
.login-aside-p{ position:relative; font-size:13px; color:#9db4d8; margin:14px 0 0; max-width:380px; line-height:1.6 }

.login-stats{ position:relative; display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:28px; max-width:420px }
.login-stat{
  padding:14px; border-radius:11px;
  background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08);
  backdrop-filter: blur(8px);
}
.login-stat-v{ font-family:"Space Grotesk", sans-serif; font-size:23px; font-weight:600; color:#fff; letter-spacing:-0.02em }
.login-stat-l{ font-size:11px; color:#8ba6cf; margin-top:3px }

.login-feed{ position:relative; margin-top:auto; max-width:420px }
.login-feed-item{
  display:flex; align-items:center; gap:10px;
  padding:9px 12px; border-radius:9px; margin-top:7px;
  background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.06);
  font-size:11.5px; color:#b8c8e4;
}
.login-feed-dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; box-shadow:0 0 8px currentColor }

</style>
</head>

  <div class="splash-logo">K</div>
  <div class="splash-name">KATALYST</div>
  <div class="splash-sub">Fixed Assets · RFID</div>
  <div class="splash-bar"></div>
</div>
<div id="root"></div>

<script type="text/babel" src="app.jsx"></script>
